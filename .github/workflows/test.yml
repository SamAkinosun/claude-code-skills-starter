name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make hooks executable
        run: chmod +x .claude/hooks/*.sh
      - name: Run hook tests
        run: python3 tests/test_block_secrets.py
